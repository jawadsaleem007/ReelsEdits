[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelsedits-matcher"
version = "0.1.0"
description = "Clip-to-slot assignment solver for ReelsEdits"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["reelsedits-common>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
# numpy/scipy are not required by the reference solver -- the chain DP is pure
# Python and runs in ~50ms. They become relevant only for the learned scorer.
learned = ["numpy>=1.26", "scikit-learn>=1.5"]

[tool.hatch.build.targets.wheel]
packages = ["reelsedits_matcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
