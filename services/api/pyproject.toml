[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelsedits-api"
version = "0.1.0"
description = "ReelsEdits public API"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "boto3>=1.34",
    "temporalio>=1.6",
    "python-jose[cryptography]>=3.3",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "reelsedits-common>=0.1.0",
    "reelsedits-matcher>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
