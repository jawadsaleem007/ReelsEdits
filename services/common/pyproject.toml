[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelsedits-common"
version = "0.1.0"
description = "Editing Blueprint (EBP) models and shared vocabulary for ReelsEdits"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jawad Saleem" }]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.22",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["reelsedits_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"


[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
