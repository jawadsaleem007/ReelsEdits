[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelsedits-analyzer"
version = "0.2.0"
description = "Reference video analysis -- video to Editing Blueprint"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "reelsedits-common>=0.1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",       # v0 beat/structure; replaced per docs/07 s6
    "opencv-python-headless>=4.9",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.22", "ruff>=0.5"]

# Semantic labelling. Without these, subject_class stays "any" and cross-domain
# matching is inactive -- the pipeline still runs, on structure alone.
#   pip install -e services/analyzer[vlm]     then set REELSEDITS_VLM_MODEL
#   pip install -e services/analyzer[clip]    cheaper, weaker
vlm = ["torch>=2.3", "transformers>=4.45", "accelerate>=0.30", "pillow>=10.0"]
clip = ["torch>=2.3", "transformers>=4.40", "pillow>=10.0"]

# The rest of the production stack (docs/07).
gpu = ["torch>=2.3", "demucs>=4.0", "transformers>=4.45"]

[tool.hatch.build.targets.wheel]
packages = ["reelsedits_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
