receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: { timeout: 5s }
  # GPU spans carry gpu_seconds and vram_peak_mb; keep them out of the
  # sampling decision so cost telemetry is never lost to a sampler.
  attributes:
    actions:
      - key: service.namespace
        value: reelsedits
        action: upsert

exporters:
  debug: { verbosity: normal }
  prometheus: { endpoint: 0.0.0.0:8889 }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
