# Local development stack.
#
#   docker compose up -d
#   open http://localhost:8000/docs
#
# GPU workers are NOT in this file. They need CUDA, model weights and NVENC,
# and running them locally is a separate opt-in (docker-compose.gpu.yml). Local
# development against stubbed workers is the fast path and covers most work.

name: reelsedits

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reelsedits
      POSTGRES_PASSWORD: reelsedits
      POSTGRES_DB: reelsedits
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelsedits"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage. Uploads go direct from the browser to here
  # via presigned URLs -- the API never handles media bytes.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reelsedits
      MINIO_ROOT_PASSWORD: reelsedits
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 reelsedits reelsedits &&
      mc mb -p local/reelsedits-local &&
      mc anonymous set download local/reelsedits-local/public &&
      echo 'bucket ready'"

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrantdata:/qdrant/storage]

  # Workflow durability. Gives us durable timers, per-stage retry policy,
  # compensation on cancel, and mid-flight worker redeploys without losing
  # in-progress jobs. Writing this against SQS by hand costs six months and
  # still gets replay-after-crash wrong.
  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: reelsedits
      POSTGRES_PWD: reelsedits
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:latest
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports: ["8123:8123", "9010:9000"]
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      REELSEDITS_ENVIRONMENT: local
      REELSEDITS_DEV_AUTH_BYPASS: "true"
      REELSEDITS_DATABASE_URL: postgresql+asyncpg://reelsedits:reelsedits@postgres:5432/reelsedits
      REELSEDITS_REDIS_URL: redis://redis:6379/0
      REELSEDITS_S3_ENDPOINT_URL: http://minio:9000
      REELSEDITS_S3_BUCKET: reelsedits-local
      REELSEDITS_QDRANT_URL: http://qdrant:6333
      REELSEDITS_TEMPORAL_HOST: temporal:7233
      AWS_ACCESS_KEY_ID: reelsedits
      AWS_SECRET_ACCESS_KEY: reelsedits
    ports: ["8000:8000"]
    volumes:
      - ../services:/app/services:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    volumes:
      - ../web:/app:cached
      - /app/node_modules

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml:ro
    ports: ["4317:4317", "4318:4318"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  qdrantdata:
  chdata:
